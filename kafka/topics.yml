# Kafka topic definitions for orders-service
#
# Operational source of truth for Docker/K8s scripts: kafka/topics.list
# Ansible uses the kafka_topics variable in inventory group_vars.
#
# KRaft mode — ZooKeeper is NOT used.

topics:
  - name: orders-events
    partitions: 3
    replication_factor: 1
    config:
      retention.ms: "604800000"       # 7 days
      cleanup.policy: delete
      min.insync.replicas: "1"
      compression.type: producer
