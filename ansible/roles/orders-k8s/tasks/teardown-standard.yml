---
- name: Remove ServiceMonitor
  kubernetes.core.k8s:
    kubeconfig: "{{ kubeconfig_path }}"
    state: absent
    api_version: monitoring.coreos.com/v1
    kind: ServiceMonitor
    name: orders-service-monitor
    namespace: "{{ orders_namespace }}"
  ignore_errors: true

- name: Remove ingress
  kubernetes.core.k8s:
    kubeconfig: "{{ kubeconfig_path }}"
    state: absent
    api_version: networking.k8s.io/v1
    kind: Ingress
    name: orders-ingress
    namespace: "{{ orders_namespace }}"
  ignore_errors: true

- name: Remove orders service
  kubernetes.core.k8s:
    kubeconfig: "{{ kubeconfig_path }}"
    state: absent
    api_version: v1
    kind: Service
    name: orders-service
    namespace: "{{ orders_namespace }}"
  ignore_errors: true

- name: Remove orders-service deployment
  kubernetes.core.k8s:
    kubeconfig: "{{ kubeconfig_path }}"
    state: absent
    api_version: apps/v1
    kind: Deployment
    name: orders-service
    namespace: "{{ orders_namespace }}"
  ignore_errors: true

- name: Remove Kafka topic init job
  kubernetes.core.k8s:
    kubeconfig: "{{ kubeconfig_path }}"
    state: absent
    api_version: batch/v1
    kind: Job
    name: kafka-init-topics
    namespace: "{{ orders_namespace }}"
  ignore_errors: true
  when: kafka_enabled | default(false) | bool

- name: Remove Kafka topics ConfigMap
  kubernetes.core.k8s:
    kubeconfig: "{{ kubeconfig_path }}"
    state: absent
    api_version: v1
    kind: ConfigMap
    name: kafka-topics-config
    namespace: "{{ orders_namespace }}"
  ignore_errors: true
  when: kafka_enabled | default(false) | bool

- name: Remove Kafka service
  kubernetes.core.k8s:
    kubeconfig: "{{ kubeconfig_path }}"
    state: absent
    api_version: v1
    kind: Service
    name: "{{ kafka_service_name | default('kafka') }}"
    namespace: "{{ orders_namespace }}"
  ignore_errors: true
  when: kafka_enabled | default(false) | bool

- name: Remove Kafka deployment
  kubernetes.core.k8s:
    kubeconfig: "{{ kubeconfig_path }}"
    state: absent
    api_version: apps/v1
    kind: Deployment
    name: "{{ kafka_service_name | default('kafka') }}"
    namespace: "{{ orders_namespace }}"
  ignore_errors: true
  when: kafka_enabled | default(false) | bool

- name: Remove Oracle service
  kubernetes.core.k8s:
    kubeconfig: "{{ kubeconfig_path }}"
    state: absent
    api_version: v1
    kind: Service
    name: "{{ oracle_service_name | default('oracle') }}"
    namespace: "{{ orders_namespace }}"
  ignore_errors: true
  when: oracle_enabled | default(false) | bool

- name: Remove Oracle deployment
  kubernetes.core.k8s:
    kubeconfig: "{{ kubeconfig_path }}"
    state: absent
    api_version: apps/v1
    kind: Deployment
    name: "{{ oracle_service_name | default('oracle') }}"
    namespace: "{{ orders_namespace }}"
  ignore_errors: true
  when: oracle_enabled | default(false) | bool

- name: Remove Oracle PVC
  kubernetes.core.k8s:
    kubeconfig: "{{ kubeconfig_path }}"
    state: absent
    api_version: v1
    kind: PersistentVolumeClaim
    name: oracle-data
    namespace: "{{ orders_namespace }}"
  ignore_errors: true
  when: oracle_enabled | default(false) | bool

- name: Remove namespace
  kubernetes.core.k8s:
    kubeconfig: "{{ kubeconfig_path }}"
    state: absent
    api_version: v1
    kind: Namespace
    name: "{{ orders_namespace }}"
    wait: true
    wait_timeout: 120
  when: orders_teardown_delete_namespace | default(true) | bool

- name: Show teardown result
  ansible.builtin.debug:
    msg: "Removed orders-service (standard) resources from namespace {{ orders_namespace }}"
