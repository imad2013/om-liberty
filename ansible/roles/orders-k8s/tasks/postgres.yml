---
- name: Deploy PostgreSQL PVC
  kubernetes.core.k8s:
    kubeconfig: "{{ kubeconfig_path }}"
    state: present
    definition: "{{ lookup('template', 'postgres-pvc.yaml.j2') | from_yaml }}"

- name: Deploy PostgreSQL
  kubernetes.core.k8s:
    kubeconfig: "{{ kubeconfig_path }}"
    state: present
    definition: "{{ lookup('template', 'postgres-deployment.yaml.j2') | from_yaml }}"

- name: Deploy PostgreSQL service
  kubernetes.core.k8s:
    kubeconfig: "{{ kubeconfig_path }}"
    state: present
    definition: "{{ lookup('template', 'postgres-service.yaml.j2') | from_yaml }}"

- name: Wait for PostgreSQL to become ready
  kubernetes.core.k8s_info:
    kubeconfig: "{{ kubeconfig_path }}"
    api_version: apps/v1
    kind: Deployment
    name: "{{ postgres_service_name }}"
    namespace: "{{ orders_namespace }}"
  register: postgres_deployment_info
  until: >
    postgres_deployment_info.resources | length > 0 and
    (postgres_deployment_info.resources[0].status.readyReplicas | default(0) | int) >= 1
  retries: "{{ (orders_rollout_wait_timeout | int) // 10 }}"
  delay: 10

- name: Show PostgreSQL summary
  ansible.builtin.debug:
    msg:
      - "PostgreSQL image: {{ postgres_image }}"
      - "Database: {{ postgres_db }}@{{ postgres_service_name }}:5432"
