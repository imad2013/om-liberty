---
- name: Read namespace
  kubernetes.core.k8s_info:
    kubeconfig: "{{ kubeconfig_path }}"
    api_version: v1
    kind: Namespace
    name: "{{ orders_namespace }}"
  register: orders_ns_info

- name: Read orders-service deployment
  kubernetes.core.k8s_info:
    kubeconfig: "{{ kubeconfig_path }}"
    api_version: apps/v1
    kind: Deployment
    name: orders-service
    namespace: "{{ orders_namespace }}"
  register: orders_deployment_info
  when: orders_ns_info.resources | length > 0

- name: Read service
  kubernetes.core.k8s_info:
    kubeconfig: "{{ kubeconfig_path }}"
    api_version: v1
    kind: Service
    name: orders-service
    namespace: "{{ orders_namespace }}"
  register: orders_service_info
  when: orders_ns_info.resources | length > 0

- name: Read ingress
  kubernetes.core.k8s_info:
    kubeconfig: "{{ kubeconfig_path }}"
    api_version: networking.k8s.io/v1
    kind: Ingress
    name: orders-ingress
    namespace: "{{ orders_namespace }}"
  register: orders_ingress_info
  when: orders_ns_info.resources | length > 0

- name: Summarize deployment status
  ansible.builtin.debug:
    msg:
      namespace: "{{ orders_namespace }}"
      namespace_exists: "{{ (orders_ns_info.resources | length) > 0 }}"
      deployment: "{{ orders_deployment_info.resources[0].metadata.name | default('n/a') }}"
      image: "{{ orders_deployment_info.resources[0].spec.template.spec.containers[0].image | default('n/a') }}"
      ready_replicas: "{{ orders_deployment_info.resources[0].status.readyReplicas | default(0) }}"
      desired_replicas: "{{ orders_deployment_info.resources[0].spec.replicas | default(0) }}"
      ingress_host: "{{ orders_ingress_info.resources[0].spec.rules[0].host | default('n/a') }}"
  when: orders_ns_info.resources | length > 0

- name: Report missing namespace
  ansible.builtin.debug:
    msg: "Namespace {{ orders_namespace }} does not exist. Run deploy-standard playbook first."
  when: orders_ns_info.resources | length == 0
