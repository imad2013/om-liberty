apiVersion: apps/v1
kind: Deployment
metadata:
  name: oracle
  namespace: orders
  labels:
    app: oracle
spec:
  replicas: 1
  selector:
    matchLabels:
      app: oracle
  template:
    metadata:
      labels:
        app: oracle
    spec:
      containers:
        - name: oracle
          image: ora26
          ports:
            - containerPort: 1521
          volumeMounts:
            - name: oracle-data
              mountPath: /opt/oracle/oradata
          readinessProbe:
            exec:
              command:
                - /bin/bash
                - -c
                - "echo 'SELECT 1 FROM DUAL;' | sqlplus -S dbadmin/dbadmin123@//localhost:1521/devdb | grep -q '1'"
            initialDelaySeconds: 120
            periodSeconds: 30
            failureThreshold: 20
          livenessProbe:
            exec:
              command:
                - /bin/bash
                - -c
                - "echo 'SELECT 1 FROM DUAL;' | sqlplus -S dbadmin/dbadmin123@//localhost:1521/devdb | grep -q '1'"
            initialDelaySeconds: 180
            periodSeconds: 30
            failureThreshold: 10
      volumes:
        - name: oracle-data
          persistentVolumeClaim:
            claimName: oracle-data
