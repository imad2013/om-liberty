services:
  oracle:
    image: ora26
    container_name: orders-oracle
    ports:
      - "1521:1521"
    volumes:
      - oracle_data:/opt/oracle/oradata
    healthcheck:
      test: ["CMD-SHELL", "echo 'SELECT 1 FROM DUAL;' | sqlplus -S dbadmin/dbadmin123@//localhost:1521/devdb | grep -q '1'"]
      interval: 30s
      timeout: 10s
      retries: 20
      start_period: 180s

  kafka:
    image: apache/kafka:latest
    container_name: orders-kafka
    hostname: kafka
    ports:
      - "9094:9094"
    environment:
      CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093,PLAINTEXT_HOST://0.0.0.0:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:9094
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092"]
      interval: 10s
      timeout: 10s
      retries: 12

  kafka-init:
    image: apache/kafka:latest
    container_name: orders-kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    volumes:
      - ./kafka/topics.list:/etc/kafka/topics.list:ro
      - ./kafka/scripts/create-topics.sh:/usr/local/bin/create-topics.sh:ro
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_TOPICS_LIST: /etc/kafka/topics.list
    entrypoint: ["/bin/bash", "/usr/local/bin/create-topics.sh"]
    restart: "no"

  orders-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVER_CONFIG: server.xml
    container_name: orders-service
    ports:
      - "9080:9080"
    environment:
      MP_METRICS_TAGS: "version=v1,color=blue"
      ORDERS_DB_URL: "jdbc:oracle:thin:@//oracle:1521/devdb"
      ORDERS_DB_USER: dbadmin
      ORDERS_DB_PASSWORD: dbadmin123
    depends_on:
      oracle:
        condition: service_healthy
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully

volumes:
  oracle_data:
  kafka_data:
